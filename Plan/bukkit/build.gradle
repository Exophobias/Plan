import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

repositories {
    maven { // Placeholder API repository
        url = "https://repo.extendedclip.com/releases/"
    }
}

def paper263 = providers.gradleProperty("paper26.3").isPresent()
def bukkitApi = paper263
        ? "io.papermc.paper:paper-api:26.3.build.26-alpha"
        : "com.destroystokyo.paper:paper-api:$paperVersion"

dependencies {
    implementation project(":common")

    implementation "net.playeranalytics:platform-abstraction-layer-bukkit:$palVersion"
    implementation "org.bstats:bstats-bukkit:$bstatsVersion"

    compileOnly bukkitApi
    compileOnly "me.clip:placeholderapi:$placeholderapiVersion"

    testImplementation(testFixtures(project(":common")))
    testImplementation(project(":extensions:adventure"))
    testImplementation bukkitApi
}

compileJava {
    options.release = paper263 ? 25 : 17
}

processResources {
    inputs.property("version", fullVersion)

    filesMatching("plugin.yml") {
        expand("version": fullVersion)
    }
}

tasks.register('verifyPaperApi') {
    doLast {
        def api = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.name == 'paper-api'
        }
        def expected = paper263 ? '26.3.build.26-alpha' : paperVersion
        def expectedGroup = paper263 ? 'io.papermc.paper' : 'com.destroystokyo.paper'
        if (api == null || api.moduleVersion.id.version != expected || api.moduleVersion.id.group != expectedGroup) {
            throw new GradleException("Expected ${bukkitApi}, resolved ${api?.moduleVersion?.id}")
        }
        logger.lifecycle("paper-api:jar:${api.moduleVersion.id.version}")
    }
}
